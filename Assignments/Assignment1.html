<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Form Project</title>
    <meta charset = "UTF-8">
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel = "stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin = "anonymous">
    <meta name = "viewport" content = "width = device-width, inital scale = 1.0">
</head>
<body class = "container">
    <form action = "#" method = "post" class = "row g-3">
        <div class = "col-md-6">
            <label for = "first name" class = "form-label">First Name</label> 
            <input type = "text" id = "first name" name = "first name" class = "form-control" placeholder = "Enter first name">
        </div>
        <div class = "col-md-6">
            <label for = "last name" class = "form-label">Last Name</label>
            <input type = "text" id = "last name" name = "last name" class = "form-control" placeholder = "Enter last name">
        </div>
        <div class = "col-12">
        <label for = "address">Address</label>
        <input type = "text" id = "address" name = "address" class = "form-control" placeholder = "Enter your address">
        </div>
        <div class = "col-md-6">
            <label for = "city" class = "form-label">City</label>
            <input type = "text" id = "city" name = "city" class = "form-control">
        </div>
        <div class = "col-md-4">
            <label for = "state" class = "form-label">State</label>
            <select id = "state" name = "state" class = "form-select">
                <option value = "Colorado">Colorado</option>
                <option value = "New York">New York</option>
                <option value = "Michigan" selected>Michigan</option>
                <option value = "Alaska">Alaska</option>
                <option value = "Maryland">Maryland</option>
            </select>
        </div>
        <div class = "col-md-2">
            <label for = "zip" class = "form-label">Zip</label>
            <input type = "text" id = "zip" name = "zip" class = "form-control">
        </div>
        <div class = "col-md-6">
            <label for = "phone" class = "form-label">Phone</label>
            <input type = "text" id = "phone" name = "phone" maxlength = "10" class = "form-control">
        </div>
        <div class = "col-md-6">
            <label for = "email" class = "form-label">Email</label>
            <input type = "text" id = "email" name = "email" class = "form-control" placeholder="name@example.com">
        </div>
        <label for = "preferred contact">Preferred method of contact</label>
        <div>
            <div class = "form-check form-check-inline">
                <input class = "form-check-input" type = "radio" id = "email radio" name = "preferred contact" value = "email radio">
                <label class = "form-check-label" for = "email radio">Email</label>
            </div>
            <div class = "form-check form-check-inline">
                <input class = "form-check-input" type = "radio" id = "phone radio" name = "preferred contact" value = "phone radio">
                <label class = "form-check-label" for = "phone radio">Text</label>
            </div>
        </div>
        <div class = "col-12">
            <button type = "submit" value = "Sign in" class = "btn btn-primary">Sign in</button>
        </div>
    </form>
</body>
</html>



<!--
    1: Why must every label for match an input (or select) id? What happens if they do not match?
        So the information can be stored and then read properly. If the label doesn't match the id, the infromation will be stored
        wrong and will not be useful
    2: Why do the preferred-contact radio buttons share the same name? What would happen if they had different names?
        They share the same name so that only one option can be chosen between the options listed. If there were different names, 
        a user could choose both options
    3: What does a browser required attribute do, and why will PHP still need to validate later?
        The required attribute makes it so that input has to be filled out or answered in order to submit the form.
        The PHP code will need to make sure those fields are filled out
    4: Why group related controls (name fields together, address fields together) instead of one long list of inputs?
        So things are more legible for someone reading the code and so things are easy to understand for the user
    5: When would you use GET vs POST for a form? Why is POST a better default for this contact form once PHP is added?
        POST is for more sensitive information as well as large amounts of it where as GET is for more general information. 
        POST is better for this form because this isn't a small amount of data being requested
-->
